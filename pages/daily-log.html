<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Life Log</title><style>body{font:16px system-ui;max-width:760px;margin:48px auto;padding:20px}form{display:grid;gap:14px}label{display:grid;gap:6px}input,textarea,select{padding:10px;font:inherit}textarea{min-height:84px}button{padding:12px}</style><a href="../index.html">← Back</a><h1>我的每日生活</h1><p>按日期记录并载入睡眠、心情与运动。</p><form id="f"><label>日期<input id="date" type="date"></label><label>睡眠质量（1–10）<input id="sleep" type="number" min="1" max="10"></label><label>梦境与睡眠情况<textarea id="sleepNote" placeholder="今天做了什么梦？可能影响睡眠的原因是什么？"></textarea></label><label>心情（1–10）<input id="mood" type="number" min="1" max="10"></label><label>心情评论<textarea id="moodNote" placeholder="今天发生了什么？为什么会有这种心情？"></textarea></label><label>运动时段<select id="time"><option value="">选择时段</option><option>早上</option><option>下午</option><option>晚上</option></select></label><label>运动时长（分钟）<input id="minutes" type="number" min="0"></label><label>运动类型<input id="workout"></label><button>保存记录</button></form><p id="msg"></p><script>let f=document.querySelector("#f"),d=date;d.value=new Date().toISOString().slice(0,10);function load(){let x=JSON.parse(localStorage["log-"+d.value]||"null");if(x)for(let k in x)if(document.querySelector("#"+k))document.querySelector("#"+k).value=x[k]}d.onchange=load;f.onsubmit=e=>{e.preventDefault();let x={};[...f.elements].forEach(a=>a.id&&(x[a.id]=a.value));localStorage["log-"+d.value]=JSON.stringify(x);msg.textContent="已保存。选择日期即可载入记录。"};load()</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A personal space in Xander's archive." />
  <title>Personal space — Xander</title>
  <link rel="stylesheet" href="style.css?v=20260920-travel-clock" />
  <style>
    .space-page{width:min(860px,calc(100% - 48px));margin:56px auto 100px}.space-back{display:inline-block;margin-bottom:42px;color:var(--accent);font-size:13px}.space-card{padding:clamp(26px,5vw,56px);border:1px solid var(--line);border-radius:22px;background:#fff;box-shadow:0 14px 36px rgba(25,62,59,.06)}.space-card h1{margin:8px 0 14px;font-size:clamp(42px,7vw,76px);line-height:1.06;letter-spacing:-.06em}.space-intro{max-width:570px;color:var(--text-soft);font-size:17px}.space-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:36px}.space-slot{min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;border:1px dashed #b8d3c7;border-radius:14px;background:#f3f8f5;color:var(--muted)}.space-slot strong{font-size:19px;color:var(--text);font-weight:600;margin-top:6px}.space-slot span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}.space-note{margin-top:28px;font-size:13px;color:var(--muted)}@media(max-width:650px){.space-page{margin-top:34px}.space-slots{grid-template-columns:1fr}.space-slot{min-height:115px}}
  </style>
</head>
<body>
  <main class="space-page">
    <a class="space-back" href="index.html">← Back to the journal</a>
    <section class="space-card" aria-labelledby="space-title">
      <p class="eyebrow" id="space-collection">PERSONAL SPACE</p>
      <h1 id="space-title">A new space</h1>
      <p class="space-intro">This is a quiet place to collect ideas over time. Add whatever belongs here when you are ready.</p>
      <div class="space-slots">
        <div class="space-slot"><span>01 / Notes</span><strong>Write something</strong></div>
        <div class="space-slot"><span>02 / Media</span><strong>Add a photo</strong></div>
        <div class="space-slot"><span>03 / Resources</span><strong>Save a link</strong></div>
      </div>
      <p class="space-note">This page is intentionally open for future additions.</p>
    </section>
  </main>
  <script>
    const params=new URLSearchParams(location.search);
    const title=params.get('title'); const collection=params.get('collection');
    if(title){document.title=title+' — Xander';document.getElementById('space-title').textContent=title;}
    if(collection){document.getElementById('space-collection').textContent=collection.toUpperCase()+' · PERSONAL SPACE';}
  </script>
</body>
</html>
